<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Lobo — Resultados & Galeria Oficial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,900;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 60% Preto Mate */
      --bg-primary: #0b0b0d;
      --bg-secondary: #141418;
      --bg-card: #1a1a20;
      /* 30% Prata Metálico */
      --silver-light: #e2e5ec;
      --silver-mid: #a4abb8;
      --silver-dark: #3a3f4b;
      --silver-gradient: linear-gradient(135deg, #f3f5f8 0%, #9ca3af 50%, #d1d5db 100%);
      /* 10% Destaque Amarelo Néon */
      --accent-neon: #dfff00;
      --accent-neon-glow: rgba(223, 255, 0, 0.28);
      --transition-smooth: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--silver-light);
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Secção Principal da Galeria */
    .tl-gallery-section {
      max-width: 1280px;
      margin: 0 auto;
      padding: 4.5rem 1.25rem;
    }

    .tl-gallery-header {
      text-align: center;
      margin-bottom: 2.75rem;
    }

    .tl-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      background: rgba(223, 255, 0, 0.08);
      border: 1px solid rgba(223, 255, 0, 0.35);
      color: var(--accent-neon);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.9rem;
    }

    .tl-gallery-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.05;
      background: var(--silver-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
    }

    .tl-gallery-title span {
      background: none;
      -webkit-text-fill-color: var(--accent-neon);
    }

    .tl-gallery-subtitle {
      color: var(--silver-mid);
      font-size: 0.98rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Barra de Filtros */
    .tl-filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.65rem;
      margin-bottom: 2.5rem;
    }

    .tl-filter-btn {
      background: var(--bg-secondary);
      color: var(--silver-mid);
      border: 1px solid var(--silver-dark);
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.28s var(--transition-smooth);
    }

    .tl-filter-btn:hover {
      border-color: var(--silver-light);
      color: var(--silver-light);
      transform: translateY(-2px);
    }

    .tl-filter-btn.active {
      background: var(--accent-neon);
      color: #0b0b0d;
      border-color: var(--accent-neon);
      box-shadow: 0 0 20px var(--accent-neon-glow);
      font-weight: 700;
    }

    .tl-filter-count {
      font-size: 0.72rem;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    .tl-filter-btn.active .tl-filter-count {
      background: rgba(11, 11, 13, 0.18);
      color: #0b0b0d;
    }

    /* Grelha Responsiva */
    .tl-gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 1.15rem;
    }

    .tl-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid rgba(164, 171, 184, 0.18);
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      cursor: pointer;
      opacity: 0;
      transform: translateY(16px) scale(0.98);
      animation: cardReveal 0.45s var(--transition-smooth) forwards;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.35s var(--transition-smooth);
    }

    @keyframes cardReveal {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .tl-card:hover {
      border-color: var(--accent-neon);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65), 0 0 18px var(--accent-neon-glow);
      transform: translateY(-4px);
    }

    .tl-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.55s var(--transition-smooth), filter 0.35s ease;
    }

    .tl-card:hover img {
      transform: scale(1.06);
    }

    .tl-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(11, 11, 13, 0.92) 0%,
        rgba(11, 11, 13, 0.25) 45%,
        transparent 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.1rem;
      opacity: 0.9;
      transition: opacity 0.3s ease;
    }

    .tl-card-tag {
      align-self: flex-start;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      background: rgba(20, 20, 24, 0.85);
      border: 1px solid rgba(223, 255, 0, 0.45);
      color: var(--accent-neon);
      margin-bottom: 0.4rem;
    }

    .tl-card-caption {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--silver-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tl-zoom-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: grid;
      place-items: center;
      color: var(--silver-light);
      font-size: 0.85rem;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .tl-card:hover .tl-zoom-icon {
      background: var(--accent-neon);
      color: #0b0b0d;
      border-color: var(--accent-neon);
    }

    /* Lightbox Modal */
    .tl-lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(8, 8, 10, 0.94);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      opacity: 0;
      transition: opacity 0.28s ease;
    }

    .tl-lightbox.open {
      display: flex;
      opacity: 1;
    }

    .tl-lb-content {
      position: relative;
      max-width: 92vw;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tl-lb-img {
      max-width: 100%;
      max-height: 76vh;
      border-radius: 10px;
      border: 1px solid var(--silver-dark);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      object-fit: contain;
      background: #000;
    }

    .tl-lb-info {
      margin-top: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      font-size: 0.88rem;
      color: var(--silver-mid);
    }

    .tl-lb-badge {
      color: var(--accent-neon);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
    }

    .tl-lb-close,
    .tl-lb-nav {
      position: fixed;
      background: var(--bg-card);
      color: var(--silver-light);
      border: 1px solid var(--silver-dark);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.25rem;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 10000;
    }

    .tl-lb-close:hover,
    .tl-lb-nav:hover {
      background: var(--accent-neon);
      color: #0b0b0d;
      border-color: var(--accent-neon);
    }

    .tl-lb-close {
      top: 1.25rem;
      right: 1.25rem;
    }

    .tl-lb-prev {
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
    }

    .tl-lb-next {
      right: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
    }

    @media (max-width: 600px) {
      .tl-gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }

      .tl-card-overlay {
        padding: 0.75rem;
      }

      .tl-lb-prev { left: 0.6rem; }
      .tl-lb-next { right: 0.6rem; }
    }
  </style>
</head>
<body>

  <section class="tl-gallery-section" id="galeria-team-lobo">
    <div class="tl-gallery-header">
      <div class="tl-badge">Consultoria & Alta Performance</div>
      <h2 class="tl-gallery-title">Galeria <span>Team Lobo</span></h2>
      <p class="tl-gallery-subtitle">
        Transformações reais, atletas em palco e bastidores da consultoria comandada pelo treinador Sid Lobo.
      </p>
    </div>

    <div class="tl-filter-bar" role="tablist" aria-label="Filtros da Galeria">
      <button class="tl-filter-btn active" data-filter="todos">
        Todos <span class="tl-filter-count" id="count-todos">0</span>
      </button>
      <button class="tl-filter-btn" data-filter="evolucoes">
        Antes & Depois <span class="tl-filter-count" id="count-evolucoes">0</span>
      </button>
      <button class="tl-filter-btn" data-filter="competicoes">
        Competições <span class="tl-filter-count" id="count-competicoes">0</span>
      </button>
      <button class="tl-filter-btn" data-filter="bastidores">
        Bastidores & Equipa <span class="tl-filter-count" id="count-bastidores">0</span>
      </button>
      <button class="tl-filter-btn" data-filter="marca">
        Identidade <span class="tl-filter-count" id="count-marca">0</span>
      </button>
    </div>

    <div class="tl-gallery-grid" id="tl-gallery-grid"></div>
  </section>

  <!-- Lightbox -->
  <div class="tl-lightbox" id="tl-lightbox" aria-hidden="true">
    <button class="tl-lb-close" id="tl-lb-close" aria-label="Fechar">&times;</button>
    <button class="tl-lb-nav tl-lb-prev" id="tl-lb-prev" aria-label="Anterior">&#10094;</button>
    <div class="tl-lb-content">
      <img class="tl-lb-img" id="tl-lb-img" src="" alt="Visualização Team Lobo">
      <div class="tl-lb-info">
        <span class="tl-lb-badge" id="tl-lb-cat">Categoria</span>
        <span id="tl-lb-counter">1 / 33</span>
      </div>
    </div>
    <button class="tl-lb-nav tl-lb-next" id="tl-lb-next" aria-label="Seguinte">&#10095;</button>
  </div>

  <script>
    const galeriaTeamLobo = {
      basePath: "img/",
      categorias: {
        evolucoes: {
          label: "Antes & Depois",
          titulo: "Evolução de Aluno",
          arquivos: [
            "IMG-20261125-WA0061.jpg",
            "IMG-20261125-WA0062.jpg",
            "IMG-20261125-WA0063.jpg",
            "IMG-20261125-WA0064.jpg",
            "IMG-20261125-WA0065.jpg",
            "IMG-20261125-WA0066.jpg",
            "IMG-20261125-WA0067.jpg"
          ]
        },
        competicoes: {
          label: "Competições",
          titulo: "Palco & Pódio",
          arquivos: [
            "IMG-20261125-WA0052.jpg",
            "IMG-20261125-WA0054.jpg",
            "IMG-20261125-WA0055.jpg",
            "IMG-20261125-WA0058.jpg",
            "IMG-20261125-WA0059.jpg",
            "IMG-20261125-WA0060.jpg",
            "IMG-20261125-WA0069.jpg",
            "IMG-20261125-WA0070.jpg",
            "IMG-20261125-WA0071.jpg",
            "IMG-20261125-WA0072.jpg"
          ]
        },
        bastidores: {
          label: "Bastidores & Equipa",
          titulo: "Team Lobo em Ação",
          arquivos: [
            "IMG-20261125-WA0057.jpg",
            "IMG-20261125-WA0073.jpg",
            "IMG-20261125-WA0074.jpg",
            "IMG-20261125-WA0075.jpg",
            "IMG-20261125-WA0076.jpg",
            "IMG-20261125-WA0077.jpg",
            "IMG-20261125-WA0078.jpg",
            "IMG-20261125-WA0079.jpg",
            "IMG-20261125-WA0080.jpg",
            "IMG-20261125-WA0082.jpg",
            "IMG-20261125-WA0083.jpg",
            "IMG-20261125-WA0084.jpg",
            "IMG-20261125-WA0085.jpg",
            "IMG-20261125-WA0086.jpg"
          ]
        },
        marca: {
          label: "Identidade",
          titulo: "Marca Oficial",
          arquivos: [
            "IMG-20261125-WA0053.jpg",
            "IMG-20261125-WA0068.jpg"
          ]
        }
      }
    };

    // Constrói lista unificada de itens
    const todosItens = [];
    Object.entries(galeriaTeamLobo.categorias).forEach(([chave, grupo]) => {
      grupo.arquivos.forEach((arquivo, idx) => {
        todosItens.push({
          categoria: chave,
          label: grupo.label,
          titulo: `${grupo.titulo} #${String(idx + 1).padStart(2, '0')}`,
          src: galeriaTeamLobo.basePath + arquivo
        });
      });
    });

    // Atualiza contadores nos botões
    document.getElementById('count-todos').textContent = todosItens.length;
    document.getElementById('count-evolucoes').textContent = galeriaTeamLobo.categorias.evolucoes.arquivos.length;
    document.getElementById('count-competicoes').textContent = galeriaTeamLobo.categorias.competicoes.arquivos.length;
    document.getElementById('count-bastidores').textContent = galeriaTeamLobo.categorias.bastidores.arquivos.length;
    document.getElementById('count-marca').textContent = galeriaTeamLobo.categorias.marca.arquivos.length;

    const gridEl = document.getElementById('tl-gallery-grid');
    let itensFiltradosAtuais = [...todosItens];
    let indiceLightboxAtual = 0;

    function renderizarGaleria(filtro = 'todos') {
      gridEl.innerHTML = '';
      itensFiltradosAtuais = filtro === 'todos'
        ? todosItens
        : todosItens.filter(item => item.categoria === filtro);

      itensFiltradosAtuais.forEach((item, index) => {
        const card = document.createElement('article');
        card.className = 'tl-card';
        card.style.animationDelay = `${Math.min(index * 0.035, 0.45)}s`;
        card.innerHTML = `
          <img src="${item.src}" alt="${item.titulo}" loading="lazy">
          <div class="tl-card-overlay">
            <span class="tl-card-tag">${item.label}</span>
            <div class="tl-card-caption">
              <span>${item.titulo}</span>
              <span class="tl-zoom-icon" aria-hidden="true">+</span>
            </div>
          </div>
        `;
        card.addEventListener('click', () => abrirLightbox(index));
        gridEl.appendChild(card);
      });
    }

    // Eventos dos botões de filtro
    document.querySelectorAll('.tl-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tl-filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderizarGaleria(btn.dataset.filter);
      });
    });

    // Lógica do Lightbox
    const lightbox = document.getElementById('tl-lightbox');
    const lbImg = document.getElementById('tl-lb-img');
    const lbCat = document.getElementById('tl-lb-cat');
    const lbCounter = document.getElementById('tl-lb-counter');

    function atualizarLightbox() {
      const item = itensFiltradosAtuais[indiceLightboxAtual];
      if (!item) return;
      lbImg.src = item.src;
      lbImg.alt = item.titulo;
      lbCat.textContent = `${item.label} • ${item.titulo}`;
      lbCounter.textContent = `${indiceLightboxAtual + 1} / ${itensFiltradosAtuais.length}`;
    }

    function abrirLightbox(index) {
      indiceLightboxAtual = index;
      atualizarLightbox();
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function fecharLightbox() {
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    function navegarLightbox(direcao) {
      const total = itensFiltradosAtuais.length;
      indiceLightboxAtual = (indiceLightboxAtual + direcao + total) % total;
      atualizarLightbox();
    }

    document.getElementById('tl-lb-close').addEventListener('click', fecharLightbox);
    document.getElementById('tl-lb-prev').addEventListener('click', () => navegarLightbox(-1));
    document.getElementById('tl-lb-next').addEventListener('click', () => navegarLightbox(1));

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) fecharLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') fecharLightbox();
      if (e.key === 'ArrowLeft') navegarLightbox(-1);
      if (e.key === 'ArrowRight') navegarLightbox(1);
    });

    // Suporte a swipe no telemóvel dentro do lightbox
    let touchStartX = 0;
    lightbox.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    lightbox.addEventListener('touchend', (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 45) {
        navegarLightbox(diff < 0 ? 1 : -1);
      }
    }, { passive: true });

    // Inicializa com "Antes & Depois" ou "Todos"
    renderizarGaleria('todos');
  </script>
</body>
</html>
